<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 130" fill="none">
  <defs>
    <linearGradient id="shieldGradLight" x1="10" y1="10" x2="110" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="60%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="glassGradLight" x1="25" y1="20" x2="95" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="accentSunLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Logo Mark -->
  <g transform="translate(10, 10)">
    <!-- Back Layer -->
    <path d="M48 18 L92 36 V76 C92 95 55 108 55 108 L38 98 V40 Z" fill="url(#shieldGradLight)" opacity="0.3"/>

    <!-- Middle Layer -->
    <path d="M38 22 L82 40 V82 C82 98 48 111 48 111 L28 100 V44 Z" fill="url(#glassGradLight)" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="4 2"/>

    <!-- Front Layer -->
    <path d="M58 8 L98 28 V70 C98 92 58 108 58 108 C58 108 18 92 18 70 V28 Z" fill="url(#shieldGradLight)" stroke="#0284C7" stroke-width="2.5"/>

    <!-- Highlights -->
    <path d="M26 36 L52 22 L75 80 L52 92 Z" fill="#FFFFFF" opacity="0.4"/>
    <path d="M72 32 L84 26 L88 45 L76 52 Z" fill="#FFFFFF" opacity="0.6"/>

    <!-- Sun Accent -->
    <circle cx="85" cy="24" r="5" fill="url(#accentSunLight)"/>
    <line x1="85" y1="14" x2="85" y2="17" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    <line x1="95" y1="24" x2="92" y2="24" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    <line x1="92" y1="17" x2="90" y2="19" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>

    <!-- Monogram detail -->
    <circle cx="58" cy="42" r="4.5" fill="#FFFFFF"/>
    <path d="M58 52 V82" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M46 64 L58 54 L70 64" fill="none" stroke="#BAE6FD" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Typography -->
  <text x="142" y="68" font-family="'Montserrat', 'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="52" letter-spacing="4" fill="#0F172A">
    IPP
  </text>
  <text x="272" y="68" font-family="'Montserrat', 'Inter', 'Segoe UI', sans-serif" font-weight="800" font-size="44" letter-spacing="3" fill="#0284C7">
    LÁMINAS
  </text>

  <!-- Divider -->
  <rect x="144" y="80" width="330" height="2" rx="1" fill="url(#shieldGradLight)"/>

  <!-- Subtitle -->
  <text x="144" y="99" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="600" font-size="12" letter-spacing="3.2" fill="#475569">
    SEGURIDAD  ·  EMPAVONADOS  ·  SOLAR
  </text>
</svg>
